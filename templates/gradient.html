<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Modern Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>:root{--fd:'Unbounded',sans-serif;--fb:'Manrope',sans-serif;--fa:'Unbounded',sans-serif;--backdrop:#0f0b17;--bg:#141021;--surface:rgba(255,255,255,.06);--text:#e9e4f2;--heading:#ffffff;--accent:#e64980;--accent2:#ff8a3d;--muted:#a99fc0;--line:rgba(255,255,255,.14);--field:rgba(255,255,255,.06);--focus:rgba(230,73,128,.3);--btntext:#fff;--footerbg:#0f0b17;--footertext:#c9bfe0;--inputborder:1px solid rgba(255,255,255,.16);--cardborder:1px solid rgba(255,255,255,.16);--cardshadow:0 20px 50px -20px rgba(0,0,0,.7);--infoborder:1px solid rgba(255,255,255,.16);--track:-.01em;--caps:none;--h3caps:none;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--fb);color:var(--text);background:var(--backdrop)}
  body.locked{overflow:hidden;height:100vh}
  .app{position:relative;max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 60px rgba(20,15,8,.28);overflow:hidden}
  .eyebrow{font-family:var(--fb);font-weight:500;font-size:.66rem;letter-spacing:.4em;text-transform:uppercase;color:var(--accent)}
  .rule{width:96px;height:2px;background:var(--accent);margin:0 auto;border-radius:2px}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .85s ease,transform .85s ease}
  .reveal.in{opacity:1;transform:none}

  /* cover overlay */
  #cover{position:absolute;top:0;left:0;width:100%;height:100vh;height:100dvh;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 34px;cursor:pointer}
  .cv-tap{margin-top:30px;font-family:var(--fb);font-weight:500;font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;opacity:.8;animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-4px);opacity:.95}}

  /* invite */
  .invsec{padding:78px 22px}
  .tl-head,.vn-head,.rs-head{text-align:center;margin:0 auto 44px;max-width:420px}
  .sec-title{font-family:var(--fd);color:var(--heading);font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.05;letter-spacing:var(--track,.04em);text-transform:var(--caps,uppercase)}
  .script-date{font-family:var(--fa);color:var(--accent);font-size:clamp(1.9rem,7.5vw,2.5rem);margin-top:8px}
  .tl-head .rule{margin-top:18px}
  .timeline{position:relative;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:38px}
  .timeline::before{content:"";position:absolute;top:6px;bottom:6px;left:27px;width:2px;background:var(--line)}
  .event{display:grid;grid-template-columns:54px 1fr;align-items:center}
  .node{grid-column:1;justify-self:center;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2.5px solid var(--accent);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;opacity:0;transform:scale(.4);transition:transform .55s cubic-bezier(.34,1.56,.64,1) .08s,opacity .5s ease .08s}
  .node::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .content{opacity:0;transition:transform .7s cubic-bezier(.4,0,.2,1),opacity .7s ease;grid-column:2;padding-left:14px}
  .event.left .content{transform:translateX(-40px)}.event.right .content{transform:translateX(40px)}
  .content h3{font-family:var(--fd);font-weight:var(--h3w,600);font-size:1.3rem;letter-spacing:.02em;color:var(--heading);text-transform:var(--h3caps,none)}
  .content p{font-family:var(--fb);font-size:.92rem;color:var(--muted);margin-top:3px}
  .event.in .content{opacity:1;transform:none}.event.in .node{opacity:1;transform:scale(1)}
  .vn-wrap{max-width:420px;margin:0 auto;text-align:center}
  .vn-name{font-family:var(--fa);color:var(--accent);font-size:clamp(2.6rem,11vw,3.8rem);line-height:1;margin:.05em 0 .1em}
  .vn-head .rule{margin:16px auto 28px}
  .vn-tag{font-family:var(--fb);font-size:1.1rem;color:var(--muted);margin-bottom:30px}
  .map-card{position:relative;border-radius:14px;overflow:hidden;border:var(--cardborder);box-shadow:var(--cardshadow)}
  .map-card iframe{width:100%;height:330px;border:0;display:block}
  .info{position:absolute;top:14px;left:14px;width:76%;max-width:270px;background:var(--surface);border-radius:11px;padding:12px 14px;text-align:left;border:var(--infoborder)}
  .info h3{font-family:var(--fd);font-weight:600;font-size:1.15rem;color:var(--heading);text-transform:var(--h3caps,none)}
  .info .addr{font-family:var(--fb);font-size:.76rem;color:var(--muted);margin-top:5px;line-height:1.5}
  .get-dir{display:inline-flex;align-items:center;gap:9px;margin-top:30px;font-family:var(--fb);font-weight:500;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--btntext);background:var(--accent);border:var(--btnborder,none);border-radius:999px;padding:14px 30px;text-decoration:none;box-shadow:var(--btnshadow,none);transition:transform .15s ease,filter .15s}
  .get-dir:hover{filter:brightness(1.06);transform:translateY(-2px)}.get-dir svg{width:15px;height:15px;fill:currentColor}
  .rs-script{font-family:var(--fd);color:var(--accent);font-size:clamp(3rem,15vw,4.6rem);line-height:.92;margin-top:2px;letter-spacing:var(--track,.02em);text-transform:var(--caps,uppercase)}
  .rs-head .rule{margin-top:14px}.rs-wrap{max-width:420px;margin:0 auto}
  .field{margin-bottom:22px}
  .field>label{display:block;font-family:var(--fb);font-weight:500;font-size:1rem;color:var(--heading);margin-bottom:9px}
  .field input,.field textarea{width:100%;font-family:var(--fb);font-size:1rem;color:var(--text);background:var(--field);border:var(--inputborder);border-radius:8px;padding:14px 15px;outline:none;transition:box-shadow .15s,border-color .15s}
  .field textarea{resize:vertical;min-height:82px;line-height:1.5}
  .field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.7}
  .field input:focus,.field textarea:focus{box-shadow:0 0 0 3px var(--focus)}
  .choices{display:flex;gap:12px}
  .choice,.attend{flex:1;font-family:var(--fb);font-weight:500;font-size:.98rem;color:var(--text);background:var(--field);border:var(--inputborder);border-radius:10px;padding:15px;cursor:pointer;text-align:center;transition:all .15s}
  .choice.selected,.attend.selected{background:var(--accent);color:var(--btntext);border-color:var(--accent)}
  .members{margin-top:14px;display:flex;flex-direction:column;gap:11px}
  .members-note{font-family:var(--fb);font-size:.76rem;color:var(--muted)}
  .member label{display:block;font-family:var(--fb);font-weight:500;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .send{width:100%;margin-top:28px;font-family:var(--fd);font-size:1rem;letter-spacing:.14em;text-transform:uppercase;color:var(--btntext);background:var(--accent);border:var(--btnborder,none);border-radius:12px;padding:18px;cursor:pointer;box-shadow:var(--btnshadow,none);transition:transform .15s,filter .15s}
  .send:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .err{color:var(--accent2);font-family:var(--fb);font-size:.92rem;margin-top:10px;text-align:center;min-height:1.2em}
  .thanks{display:none;text-align:center;padding:26px 10px}.thanks.show{display:block;animation:fadeUp .7s ease}
  .thanks .tick{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--btntext);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.7rem}
  .thanks h3{font-family:var(--fa);color:var(--accent);font-size:2.8rem;line-height:1}
  .thanks p{font-family:var(--fb);color:var(--muted);font-size:1.05rem;margin-top:6px}
  footer{text-align:center;padding:44px 22px 40px;background:var(--footerbg);color:var(--footertext)}
  footer .nm{font-family:var(--fa);color:var(--accent);font-size:2.4rem;display:block;margin-bottom:2px}
  footer .dt{font-family:var(--fb);font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;opacity:.75;margin-bottom:20px}
  .share-row{display:flex;gap:10px;justify-content:center}
  .share-row button{font-family:var(--fb);font-weight:500;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--footertext);background:transparent;border:1.5px solid var(--accent);border-radius:999px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .share-row svg{width:14px;height:14px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);background:var(--heading);color:var(--bg);font-family:var(--fb);font-size:.7rem;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:300}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){#cover{display:none}.reveal,.content,.node{opacity:1!important;transform:none!important}body.locked{overflow:auto;height:auto}}
#cover{background:linear-gradient(160deg,#5b2a86,#e64980 60%,#ff8a3d);color:#fff;justify-content:center;overflow:hidden;transition:transform .9s ease,opacity .8s}
 #cover.gone{transform:scale(1.1);opacity:0}
 .gr-orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
 .gr-orb.o1{width:220px;height:220px;background:#ff8a3d;top:-40px;right:-40px}
 .gr-orb.o2{width:260px;height:260px;background:#5b2a86;bottom:-60px;left:-60px}
 .gr-inner{position:relative;z-index:2}
 .gr-names{font-family:'Unbounded',sans-serif;font-weight:700;color:#fff;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.02;letter-spacing:-.02em;margin:.1em 0}
 .gr-date{font-family:'Manrope',sans-serif;font-weight:600;letter-spacing:.04em}
 .gr-ven{font-family:'Manrope',sans-serif;font-size:.86rem;opacity:.85;margin-top:6px}
 #venue{background:linear-gradient(180deg,#141021,#1a1428)}</style></head>
<body class="locked"><div class="app">
<div id="cover">
   <div class="gr-orb o1"></div><div class="gr-orb o2"></div>
   <div class="gr-inner">
     <div class="eyebrow" style="color:#ff8a3d">Save the Date</div>
     <div class="gr-names" id="cv-names"></div>
     <div class="gr-date" id="cv-date"></div>
     <div class="gr-ven" id="cv-venue"></div>
     <div class="cv-tap" style="color:#e9e4f2">Scroll &darr;</div>
   </div>
 </div>

  <section class="invsec" id="timeline-sec">
    <div class="tl-head reveal"><h2 class="sec-title" id="tl-title"></h2><div class="script-date" id="tl-date"></div><div class="rule"></div></div>
    <div class="timeline" id="timeline"></div>
  </section>
  <section class="invsec" id="venue">
    <div class="vn-wrap">
      <div class="vn-head reveal"><div class="eyebrow">We are uniting at</div><h2 class="vn-name" id="vn-name"></h2><div class="rule"></div><p class="vn-tag">Pack your bags and join us for the celebration</p></div>
      <div class="map-card reveal"><iframe id="vn-map" loading="lazy" title="Venue map" referrerpolicy="no-referrer-when-downgrade"></iframe><div class="info"><h3 id="vn-info-name"></h3><div class="addr" id="vn-addr"></div></div></div>
      <a class="get-dir reveal" id="vn-dir" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Get Directions</a>
    </div>
  </section>
  <section class="invsec" id="rsvp">
    <div class="rs-wrap">
      <div class="rs-head reveal"><div class="eyebrow">Kindly respond</div><div class="rs-script">RSVP</div><div class="rule"></div></div>
      <form id="rsvpForm" class="reveal" novalidate>
        <div class="field"><label for="name">Your Name</label><input id="name" type="text" placeholder="Enter your full name" autocomplete="name" /></div>
        <div class="field"><label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="Enter your phone number" autocomplete="tel" /></div>
        <div class="field"><label>Will you join us?</label><div class="choices"><button type="button" class="attend" data-val="Joining">Joyfully accept</button><button type="button" class="attend" data-val="Not joining">Regretfully decline</button></div></div>
        <div class="field" id="comingField" style="display:none"><label>Coming with</label><div class="choices"><button type="button" class="choice" data-val="With Family">With Family</button><button type="button" class="choice" data-val="Alone">Alone</button></div></div>
        <div class="field" id="countField" style="display:none"><label for="count">How many people? (including you)</label><input id="count" type="number" min="1" max="20" inputmode="numeric" placeholder="e.g. 4" /><div id="memberFields" class="members"></div></div>
        <div class="field"><label for="note" id="noteLabel">A note for us (optional)</label><textarea id="note" rows="3" placeholder="Leave a message for the couple..."></textarea></div>
        <button type="submit" class="send">Send RSVP</button><div class="err" id="err"></div>
      </form>
      <div class="thanks" id="thanks"><div class="tick">&#10003;</div><h3>Thank you!</h3><p>Your RSVP has been received. We can't wait to celebrate with you.</p></div>
    </div>
  </section>
  <footer>
    <span class="nm" id="ft-names"></span><div class="dt" id="ft-date"></div>
    <div class="share-row"><button id="copyBtn">Copy link</button><button id="waBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.043z"/></svg>WhatsApp</button></div>
  </footer>

</div><div class="toast" id="toast">Link copied</div>
<script>
const CONFIG={"couple": {"a": "Aisha", "b": "Rohan", "initials": "A & R"}, "date": "12 & 13 December 2026", "venue": {"name": "Soho House", "full": "Soho House, Mumbai", "addr": "Juhu Tara Road, Juhu, Mumbai 400049, India", "mapQuery": "Soho House Mumbai"}, "shareUrl": "https://your-invite-link.example", "rsvpEndpoint": "PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE", "events": [{"name": "Mehndi", "when": "12 Dec | 11:00 AM Onwards", "side": "left"}, {"name": "Sangeet", "when": "12 Dec | 7:00 PM Onwards", "side": "right"}, {"name": "Haldi", "when": "13 Dec | 9:00 AM Onwards", "side": "left"}, {"name": "Pheras", "when": "13 Dec | 12:00 PM Onwards", "side": "right"}, {"name": "Reception", "when": "13 Dec | 7:00 PM Onwards", "side": "left"}], "timelineTitle": "The Weekend"};

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ini=CONFIG.couple.initials.split('&').map(s=>s.trim());
function setText(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
function setHTML(id,v){const el=document.getElementById(id);if(el)el.innerHTML=v;}
setHTML('cv-initials',ini[0]+'<span class="amp">&amp;</span>'+ini[1]);
setText('cv-names',CONFIG.couple.a+' & '+CONFIG.couple.b);
setText('cv-date',CONFIG.date);
setText('cv-venue',CONFIG.venue.full);
setText('tl-title',CONFIG.timelineTitle);
setText('tl-date',CONFIG.date);
setText('vn-name',CONFIG.venue.name);
setText('vn-info-name',CONFIG.venue.full);
setText('vn-addr',CONFIG.venue.addr);
document.getElementById('vn-map').src="https://maps.google.com/maps?q="+encodeURIComponent(CONFIG.venue.mapQuery)+"&z=14&output=embed";
document.getElementById('vn-dir').href="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(CONFIG.venue.mapQuery);
setText('ft-names',CONFIG.couple.a+' & '+CONFIG.couple.b);
setText('ft-date',CONFIG.date);
const tl=document.getElementById('timeline');
CONFIG.events.forEach(e=>{const r=document.createElement('div');r.className='event '+e.side;r.innerHTML='<div class="content"><h3>'+e.name+'</h3><p>'+e.when+'</p></div><div class="node"></div>';tl.appendChild(r);});

/* cover reveal */
const cover=document.getElementById('cover');let opened=false;
function openCover(){if(opened)return;opened=true;cover.classList.add('gone');document.body.classList.remove('locked');window.scrollTo(0,0);setTimeout(()=>cover.style.display='none',1300);}
if(reduce){document.body.classList.remove('locked');if(cover)cover.style.display='none';}
else if(cover){cover.addEventListener('click',openCover);
  addEventListener('keydown',e=>{if(!opened&&['Enter',' ','ArrowUp'].includes(e.key)){e.preventDefault();openCover();}});
  let sy=null;cover.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;},{passive:true});
  cover.addEventListener('touchend',e=>{if(sy===null)return;if(e.changedTouches[0].clientY-sy<-40)openCover();sy=null;});
  cover.addEventListener('wheel',e=>{if(e.deltaY>10)openCover();},{passive:true});
}

/* reveals */
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.2,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
const eo=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');eo.unobserve(e.target);}})},{threshold:.3});
document.querySelectorAll('.event').forEach(el=>eo.observe(el));

/* share */
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700);}
document.getElementById('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(CONFIG.shareUrl);toast('Link copied');}catch{toast('Copy failed');}});
document.getElementById('waBtn').addEventListener('click',()=>{const txt=CONFIG.couple.a+' & '+CONFIG.couple.b+' are getting married! '+CONFIG.date;window.open('https://wa.me/?text='+encodeURIComponent(txt+' '+CONFIG.shareUrl),'_blank');});

/* RSVP */
let coming="",attending="";
document.querySelectorAll('.attend').forEach(btn=>{btn.addEventListener('click',()=>{
  document.querySelectorAll('.attend').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');attending=btn.dataset.val;document.getElementById('err').textContent='';
  const cf=document.getElementById('comingField'),ct=document.getElementById('countField'),nl=document.getElementById('noteLabel'),nt=document.getElementById('note');
  if(attending==='Joining'){cf.style.display='block';nl.textContent='A note for us (optional)';nt.placeholder='Leave a message for the couple...';}
  else{cf.style.display='none';ct.style.display='none';coming='';document.getElementById('count').value='';document.getElementById('memberFields').innerHTML='';document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));nl.textContent='Send the couple your blessings';nt.placeholder="We'll miss you \u2014 please leave your wishes and blessings...";}
});});
document.querySelectorAll('.choice').forEach(btn=>{btn.addEventListener('click',()=>{
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');coming=btn.dataset.val;document.getElementById('err').textContent='';
  const cf=document.getElementById('countField');if(coming==='With Family'){cf.style.display='block';renderMembers();}else{cf.style.display='none';document.getElementById('count').value='';document.getElementById('memberFields').innerHTML='';}
});});
const countInput=document.getElementById('count'),memberFields=document.getElementById('memberFields');
function renderMembers(){let n=parseInt(countInput.value,10);const prev=[...memberFields.querySelectorAll('.member-name')].map(i=>i.value);memberFields.innerHTML='';if(!n||n<1)return;if(n>20){n=20;countInput.value=20;}
  const note=document.createElement('div');note.className='members-note';note.textContent='Name of each guest (including you)';memberFields.appendChild(note);
  for(let i=0;i<n;i++){const w=document.createElement('div');w.className='member';const l=document.createElement('label');l.textContent='Guest '+(i+1);const inp=document.createElement('input');inp.type='text';inp.className='member-name';inp.placeholder='Full name';inp.autocomplete='off';if(prev[i]!==undefined)inp.value=prev[i];else if(i===0)inp.value=(document.getElementById('name').value||'');w.appendChild(l);w.appendChild(inp);memberFields.appendChild(w);}}
countInput.addEventListener('input',renderMembers);
document.getElementById('rsvpForm').addEventListener('submit',e=>{e.preventDefault();
  const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),err=document.getElementById('err');
  if(!name){err.textContent='Please enter your name.';return;}
  if(!phone||phone.replace(/\D/g,'').length<7){err.textContent='Please enter a valid phone number.';return;}
  if(!attending){err.textContent='Please let us know if you can join us.';return;}
  let comingVal='',guests='',members='';
  if(attending==='Joining'){if(!coming){err.textContent='Please choose With Family or Alone.';return;}comingVal=coming;guests=1;
    if(coming==='With Family'){guests=parseInt(countInput.value,10);if(!guests||guests<1){err.textContent='Please enter how many people are coming.';return;}if(guests>20)guests=20;
      const names=[...document.querySelectorAll('.member-name')].map(i=>i.value.trim());if(names.length<guests||names.some(x=>!x)){err.textContent='Please enter the name of each guest.';return;}members=names.join(', ');}else members=name;}
  const note=document.getElementById('note').value.trim();sendRSVP({name,phone,attending,coming:comingVal,guests,members,note});
});
async function sendRSVP(d){try{if(CONFIG.rsvpEndpoint&&CONFIG.rsvpEndpoint.indexOf('PASTE')===-1){await fetch(CONFIG.rsvpEndpoint,{method:'POST',mode:'no-cors',body:new URLSearchParams(d)});}}catch(e){console.error(e);}document.getElementById('rsvpForm').style.display='none';document.getElementById('thanks').classList.add('show');}

</script></body></html>
